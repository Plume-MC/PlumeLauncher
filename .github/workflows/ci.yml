name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - 'dev/**'
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

  go-test:
    runs-on: ubuntu-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend (needed for go:embed)
        working-directory: frontend
        run: bun run build

      - name: Download Go dependencies
        run: go mod download

      # Note: no coverage step here. `go test -coverprofile` proved flaky on
      # the hosted runner (all packages ok, yet the chained `go tool cover`
      # pipe exits 1), while plain `go test` below is green. Coverage stays
      # available locally via `make test-coverage` (informational only).
      - name: Run tests
        run: go test ./...

  go-build:
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend (needed for go:embed)
        working-directory: frontend
        run: bun run build

      - name: Download Go dependencies
        run: go mod download

      - name: Build
        run: go build ./...

  linux-portable-build:
    runs-on: ubuntu-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend for Go embed
        working-directory: frontend
        run: bun run build

      - name: Build portable Linux executable
        run: wails3 build

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: plume-launcher-1.0.1-linux-amd64
          path: bin/plume-launcher

  windows-portable-build:
    runs-on: windows-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Verify frontend
        working-directory: frontend
        run: |
          bun run lint
          bun run typecheck

      - name: Build frontend for Go embed
        working-directory: frontend
        run: bun run build

      - name: Run Go tests
        run: go test ./...

      - name: Build portable Windows executable
        run: wails3 build

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: plume-launcher-1.0.1-windows-amd64
          path: bin/plume-launcher.exe

  windows-installer-build:
    runs-on: windows-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements
            $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS"
            $env:Path = "$nsisPath;$env:Path"
            $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          makensis /VERSION

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend for Go embed
        working-directory: frontend
        run: bun run build

      - name: Build Windows installer
        run: wails3 task windows:package

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: plume-launcher-1.0.1-windows-amd64-installer
          if-no-files-found: error
          path: bin/*-installer.exe

  windows-signed-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build signed release candidate
        run: wails3 build

      - name: Sign and verify executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Windows signing certificate secrets are required."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "plume-launcher-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $timestampUrl = $env:WINDOWS_TIMESTAMP_URL
            if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
              $timestampUrl = "http://timestamp.digicert.com"
            }
            signtool sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr $timestampUrl /td SHA256 bin/plume-launcher.exe
            signtool verify /pa /all /v bin/plume-launcher.exe
          }
          finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $certificatePath
          }

      - name: Upload signed executable
        uses: actions/upload-artifact@v4
        with:
          name: plume-launcher-1.0.1-windows-amd64-signed
          path: bin/plume-launcher.exe

  linux-packages:
    runs-on: ubuntu-latest
    needs: [go-build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build Linux packages
        run: make deb rpm arch appimage

      - name: Build system-dependent AppImage
        run: make appimage-lite

      - name: Generate SHA256 checksums
        run: make checksums

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: plume-launcher-1.0.1-linux-packages
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage
            bin/*.pkg.tar.zst
            bin/SHA256SUMS
